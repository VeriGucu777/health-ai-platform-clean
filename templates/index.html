<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction System</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            margin-top: 50px;
            padding: 20px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #pdfLink {
            display: none;
            margin-top: 10px;
            color: #38bdf8;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🩸 Diabetes Prediction System</h2>
<!-- ADDED HERE -->

<div style="...">
    ⚠️ This application is for educational and demo purposes only.
    It has been developed as a clinical decision support tool, but it should not replace a definitive diagnosis.
</div>
<input type="text" id="patient_name" placeholder="Patient Name"><br>
<input type="number" id="Pregnancies" placeholder="Number of Pregnancies"><br>
<input type="number" id="Glucose" placeholder="Glucose"><br>
<input type="number" id="BloodPressure" placeholder="Blood Pressure"><br>
<input type="number" id="SkinThickness" placeholder="Skin Thickness"><br>
<input type="number" id="Insulin" placeholder="Insulin"><br>
<input type="number" step="0.1" id="BMI" placeholder="BMI"><br>
<input type="number" step="0.1" id="DiabetesPedigreeFunction" placeholder="Genetic Risk"><br>
<input type="number" id="Age" placeholder="Age"><br>

<button onclick="predict()">Make Prediction</button>
<br><br>

<button onclick="window.location.href='/diabetes-follow-up'">
    📋 Follow-Up List
</button>

<h3 id="result"></h3>

<a id="pdfLink" style="..." download>
    📄 Download PDF
</a>
    <img id="graphImage" style="width:100%; margin-top:20px;" />
    <div id="shapResult"></div>
</div>

<script>
function predict() {

    const data = {
        patient_name: document.getElementById("patient_name").value,
        Pregnancies: parseInt(document.getElementById("Pregnancies").value),
        Glucose: parseFloat(document.getElementById("Glucose").value),
        BloodPressure: parseFloat(document.getElementById("BloodPressure").value),
        SkinThickness: parseFloat(document.getElementById("SkinThickness").value),
        Insulin: parseFloat(document.getElementById("Insulin").value),
        BMI: parseFloat(document.getElementById("BMI").value),
        DiabetesPedigreeFunction: parseFloat(document.getElementById("DiabetesPedigreeFunction").value),
        Age: parseInt(document.getElementById("Age").value)
    };

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {

        const resultElement = document.getElementById("result");

        resultElement.innerText =
            result.result + " (%" + result.probability + ")";
        const graphImage = document.getElementById("graphImage");
graphImage.src = "data:image/png;base64," + result.graph;
        if (result.result.includes("YOK")) {
            resultElement.className = "ok";
        } else {
            resultElement.className = "risk";
        }
         const pdfLink = document.getElementById("pdfLink");
    pdfLink.href = "/download/" + result.pdf;
    pdfLink.style.display = "block";

       // Show SHAP
        const shapDiv = document.getElementById("shapResult");
       shapDiv.innerHTML = "<h3>SHAP Analysis:</h3>";

for (let key in result.shap) {

    let value = result.shap[key];
    let color = value > 0 ? "red" : "blue";

    shapDiv.innerHTML += `
        <div style="margin:5px;">
            <span>${key}</span>
            <div style="
                display:inline-block;
                width:${Math.abs(value) * 30}px;
                height:10px;
                background:${color};
                margin-left:10px;
            "></div>
            <span>${value.toFixed(2)}</span>
        </div>
    `;
}
const agentBox = document.createElement("div");
agentBox.style.marginTop = "20px";
agentBox.style.padding = "18px";
agentBox.style.background = "#eef6ff";
agentBox.style.color = "#111";
agentBox.style.borderRadius = "12px";
agentBox.style.borderLeft = "5px solid #2b7cff";

agentBox.innerHTML =
    "<h3>🤖 AI Interpretation</h3>" +
    "<p style='white-space: pre-line; line-height: 1.6;'>" +
    result.agent_comment +
    "</p>";
shapDiv.appendChild(agentBox);
    })


    .catch(err => {
        console.log("ERROR:", err);
        alert("An error occurred!");
    });
}
</script>
</body>
</html>
